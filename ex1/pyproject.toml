[project]
name = "loading"
version = "2.0"
description = "Program loading simulation for the Matrix"
authors = [
    {name = "stmaire"}
]
requires-python = ">=3.10"
dependencies = [
    "numpy >= 1.26.0, < 2.0.0",
    "pandas == 2.1.0",
    "requests == 2.33.0",
    "matplotlib == 3.7.2"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
